services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cryptospike-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptospike123}
      POSTGRES_DB: ${POSTGRES_DB:-cryptospike}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # All-in-One Service (Frontend + Backend + Nginx Reverse Proxy)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptospike-app
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-cryptospike123}@postgres:5432/${POSTGRES_DB:-cryptospike}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      JWT_SECRET: ${JWT_SECRET:-cryptospike_jwt_super_secret_key_2026}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-cspk_operator_9x}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Kx9#mQ2$vL8@wP5!Zt7&}
    ports:
      - "${APP_PORT:-8080}:80"
    # Port 80 container Nginx diarahkan ke port 8080 host (atau atur APP_PORT di env Dokploy)
    # Dokploy Traefik menggunakan port 80 & 443 host untuk routing domain SSL.

volumes:
  postgres_data:
